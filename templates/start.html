{% extends "base.html" %}

{% block title %}Starting… · all-an{% endblock %}
{% block head %}<link rel="stylesheet" href="/static/css/page.css">{% endblock %}

{% block content %}
<main class="page">
  <div class="page-inner">
    <p class="notice" role="alert" data-error hidden></p>
    <a class="btn" href="/quizzes" data-back hidden>Back to my quizzes</a>
    <p class="empty-state" data-starting>Starting…</p>
    <noscript><p class="notice">Taking a quiz needs JavaScript.</p></noscript>
  </div>
</main>
{% endblock %}

{% block scripts %}<script type="module" src="/static/js/start.js" data-quiz-id="{{ quiz_id }}"></script>{% endblock %}
