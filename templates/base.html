<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}all-an{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- SVG first: browsers that support it take it and ignore the .ico fallback below. -->
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <link rel="stylesheet" href="/static/css/base.css">
  {% block head %}{% endblock %}
</head>
<body>
  <nav class="shell-nav">
    {% if nav.signed_in %}
      <a href="/quizzes"{% if nav.active == "quizzes" %} class="is-active"{% endif %}>My quizzes</a>
      <a href="/quizzes/browse"{% if nav.active == "browse" %} class="is-active"{% endif %}>Browse</a>
      <a href="/results"{% if nav.active == "results" %} class="is-active"{% endif %}>Results</a>
      <a href="/friends"{% if nav.active == "friends" %} class="is-active"{% endif %}>Friends</a>
      {% if nav.is_admin %}
        <a href="/admin"{% if nav.active == "admin" %} class="is-active"{% endif %}>Admin</a>
      {% endif %}
      <button type="button" data-sign-out>Sign out</button>
    {% else %}
      <a href="/quizzes/browse"{% if nav.active == "browse" %} class="is-active"{% endif %}>Browse</a>
      <a href="/login"{% if nav.active == "login" %} class="is-active"{% endif %}>Sign in</a>
    {% endif %}
    <a href="/about"{% if nav.active == "about" %} class="is-active"{% endif %}>About me</a>
    <a class="primary{% if nav.active == "message" %} is-active{% endif %}" href="/message">Message me</a>
  </nav>

  {% block content %}{% endblock %}

  <script type="module" src="/static/js/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
