services:
  db:
    image: postgres:16-alpine
    container_name: all-an-db
    environment:
      POSTGRES_DB: all-an-db
      POSTGRES_USER: allan
      POSTGRES_PASSWORD: allan
    ports:
      - "5432:5432"
    volumes:
      - all-an-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U allan -d all-an-db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: all-an-app:local
    container_name: all-an-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/all-an-db
      SPRING_DATASOURCE_USERNAME: allan
      SPRING_DATASOURCE_PASSWORD: allan
    ports:
      - "8080:8080"

volumes:
  all-an-db-data:
