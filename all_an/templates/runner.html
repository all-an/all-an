{% extends "base.html" %}
{% block title %}Quiz · all-an{% endblock %}
{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/page.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/runner.css') }}">
{% endblock %}
{% block content %}
<main class="page">
  {# Replaced by the first question as soon as it loads, and by every question and verdict after. #}
  <div class="runner" id="runner" hx-get="/attempts/{{ attempt_id }}/question" hx-trigger="load" hx-swap="outerHTML">
    <p class="empty-state">Loading…</p>
  </div>
</main>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/runner.js') }}" defer></script>{% endblock %}
