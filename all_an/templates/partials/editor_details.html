{# The quiz's own fields. A form, so Enter saves; the whole card is the swap target. #}
<form id="details" class="card"
      hx-post="{{ '/quizzes/%d/details' % quiz.id if quiz else '/quizzes' }}"
      hx-target="this" hx-swap="outerHTML" hx-disabled-elt="find button[type=submit]">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

  <label class="field">
    <span class="field-label">Title</span>
    <input type="text" name="title" value="{{ values.title or '' }}">
    {% if fields.title %}<span class="field-error">{{ fields.title }}</span>{% endif %}
  </label>

  <label class="field">
    <span class="field-label">Study field</span>
    <select name="studyFieldId">
      {% for sf in study_fields %}
        <option value="{{ sf.id }}"{% if (values.studyFieldId|string == sf.id|string) or (not values.studyFieldId and loop.first) %} selected{% endif %}>{{ sf.name }}</option>
      {% endfor %}
    </select>
    {% if fields.studyFieldId %}<span class="field-error">{{ fields.studyFieldId }}</span>{% endif %}
  </label>

  <label class="field">
    <span class="field-label">Subject</span>
    <input type="text" name="subject" list="known-subjects" placeholder="English grammar, World capitals, …" value="{{ values.subject or '' }}">
    <datalist id="known-subjects">
      {% for name in known_subjects %}<option value="{{ name }}"></option>{% endfor %}
    </datalist>
    <span class="field-hint">Anything you like, inside the study field above.</span>
    {% if fields.subject %}<span class="field-error">{{ fields.subject }}</span>{% endif %}
  </label>

  <label class="field">
    <span class="field-label">Description</span>
    <textarea name="description">{{ values.description or '' }}</textarea>
    {% if fields.description %}<span class="field-error">{{ fields.description }}</span>{% endif %}
  </label>

  <label class="field">
    <span class="field-label">Default time limit (seconds)</span>
    <input type="number" name="defaultTimeLimitSeconds" min="5" max="600" value="{{ values.defaultTimeLimitSeconds }}">
    <span class="field-hint">What a new question starts with. Each can override it.</span>
    {% if fields.defaultTimeLimitSeconds %}<span class="field-error">{{ fields.defaultTimeLimitSeconds }}</span>{% endif %}
  </label>

  <label class="checkbox">
    <input type="checkbox" name="shuffleQuestions"{% if values.shuffleQuestions %} checked{% endif %}>
    Shuffle the question order each time
  </label>

  <div class="actions">
    <button type="submit" class="btn primary"><span class="idle">Save</span><span class="busy">Saving…</span></button>
    {% if quiz %}
      {# Inside the form on purpose: the unsaved fields travel with the request and come back as typed. #}
      <button type="button" class="btn"
              hx-post="/quizzes/{{ quiz.id }}/editor/{{ 'unpublish' if quiz.visibility == 'PUBLIC' else 'publish' }}"
              hx-target="#details" hx-swap="outerHTML">
        {{ "Unpublish" if quiz.visibility == "PUBLIC" else "Publish to the pool" }}
      </button>
      {% if friends %}
        <button type="button" class="btn" hx-get="/quizzes/{{ quiz.id }}/share-panel"
                hx-target="#share-panel" hx-swap="outerHTML">Share with friends</button>
      {% endif %}
    {% endif %}
  </div>
</form>
