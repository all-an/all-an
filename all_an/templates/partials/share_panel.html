<div id="share-panel">
  <form class="card share-panel" hx-post="{{ action }}" hx-target="#share-panel" hx-swap="outerHTML">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <h2 class="card-title">{{ title }}</h2>
    <p class="card-meta">
      They will get it in their Shared list, and an email if the site is configured to send one.
    </p>

    <div class="chips">
      {% for friend in friends %}
        <label class="chip"><input type="checkbox" name="friend_ids" value="{{ friend.id }}">{{ friend.username }}</label>
      {% endfor %}
    </div>

    <div class="actions">
      <button type="submit" class="btn primary">Share</button>
      <button type="button" class="btn" hx-get="/share-panel/close" hx-target="#share-panel" hx-swap="outerHTML">Cancel</button>
    </div>
  </form>
</div>
