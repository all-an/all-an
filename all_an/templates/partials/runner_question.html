{% set seconds_left = ((q.remainingMs + 999) // 1000) %}
<div class="runner" id="runner" data-countdown="{{ q.remainingMs }}" data-limit="{{ q.timeLimitSeconds }}">
  <div class="progress">
    <span>Question {{ q.position }} of {{ q.total }}</span>
    <span class="clock{% if seconds_left <= 10 %} urgent{% endif %}" id="clock">{{ seconds_left }}s</span>
  </div>

  <div class="timer-track" role="presentation">
    <div class="timer-bar" id="bar" style="width: {{ [100, q.remainingMs / (q.timeLimitSeconds * 1000) * 100] | min | round(1) }}%"></div>
  </div>

  <h1 class="prompt">{{ q.prompt }}</h1>

  <form id="answer-form" hx-post="/attempts/{{ attempt_id }}/answer" hx-target="#runner" hx-swap="outerHTML">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

    {% if q.kind == "MULTIPLE_CHOICE" %}
      {% for option in q.options %}
        <label class="choice">
          <input type="radio" name="option_id" value="{{ option.id }}">
          <span>{{ option.body }}</span>
        </label>
      {% endfor %}
    {% else %}
      <input class="typed-answer" name="text" autocomplete="off" autocapitalize="none" spellcheck="false"
             placeholder="Type your answer" autofocus>
    {% endif %}

    <div class="actions">
      <button type="submit" class="btn primary">Answer</button>
      <button type="button" class="btn" hx-post="/attempts/{{ attempt_id }}/finish" hx-include="this">Give up</button>
    </div>
  </form>
</div>
