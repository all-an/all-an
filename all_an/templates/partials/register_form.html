<form hx-post="/register" hx-target="this" hx-swap="outerHTML" hx-disabled-elt="find button[type=submit]" novalidate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <input type="hidden" name="next" value="{{ next }}">

  {% if form_error %}<p class="form-error" role="alert">{{ form_error }}</p>{% endif %}

  <label>
    <span class="label-text">Username</span>
    <input name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required value="{{ values.get('username', '') }}">
    {% if fields.username %}<span class="field-error">{{ fields.username }}</span>
    {% else %}<span class="field-error hint">Letters, numbers, _ and - only.</span>{% endif %}
  </label>

  <label>
    <span class="label-text">Email</span>
    <input type="email" name="email" autocomplete="email" autocapitalize="none" spellcheck="false" required value="{{ values.get('email', '') }}">
    {% if fields.email %}<span class="field-error">{{ fields.email }}</span>
    {% else %}<span class="field-error hint">Used to sign in and to reach you.</span>{% endif %}
  </label>

  <label>
    <span class="label-text">Password</span>
    <input type="password" name="password" autocomplete="new-password" required>
    {# Length is the only rule, so say so rather than implying hidden ones. #}
    {% if fields.password %}<span class="field-error">{{ fields.password }}</span>
    {% else %}<span class="field-error hint">At least 8 characters. A phrase beats a password.</span>{% endif %}
  </label>

  <button type="submit"><span class="idle">Create account</span><span class="busy">Creating…</span></button>
</form>
