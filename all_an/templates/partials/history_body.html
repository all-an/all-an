<div id="history-body">
  {% if not items %}
    <div class="empty-state"><p>You have not taken a quiz yet.</p></div>
  {% else %}
    {% for attempt in items %}
      <div class="card attempt-row">
        <a class="attempt-main" href="/results/{{ attempt.id }}">
          <div>
            <p class="card-title">{{ attempt.quizTitle }}</p>
            <p class="card-meta">
              <time datetime="{{ attempt.startedAt }}" data-date>{{ attempt.startedAt }}</time>
              {% if not attempt.finishedAt %}· unfinished{% endif %}
            </p>
          </div>
          <span class="attempt-score">{{ attempt.correct }} / {{ attempt.total }}</span>
        </a>
        <button type="button" class="btn danger delete-attempt"
                hx-post="/results/{{ attempt.id }}/delete" hx-target="#history-body" hx-swap="outerHTML"
                hx-confirm='Delete this result? Your run of "{{ attempt.quizTitle }}" - scored {{ attempt.correct }} / {{ attempt.total }} - will be removed from your history. This cannot be undone.'
                aria-label="Delete this result for {{ attempt.quizTitle }}">
          Delete
        </button>
      </div>
    {% endfor %}
  {% endif %}
</div>
