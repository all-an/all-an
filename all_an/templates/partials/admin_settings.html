<form id="admin-settings" hx-post="/admin/settings" hx-target="this" hx-swap="outerHTML">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

  {% if notice %}<p class="notice" role="status">{{ notice }}</p>{% endif %}

  <article class="card setting">
    <div class="setting-text">
      <p class="card-title">Registration</p>
      <p class="card-meta">
        Turn this off and the sign-up form stops accepting new accounts. Everyone who already
        has one can still sign in, and nothing they have made is touched.
      </p>
    </div>

    <label class="checkbox setting-switch">
      <input type="checkbox" name="registrationEnabled"{% if registrationEnabled %} checked{% endif %}>
      <span>{{ "Open" if registrationEnabled else "Closed" }}</span>
    </label>
  </article>

  <div class="actions">
    <button type="submit" class="btn primary"><span class="idle">Save</span><span class="busy">Saving…</span></button>
  </div>
</form>
