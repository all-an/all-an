{% extends "base.html" %}
{% block title %}Starting… · all-an{% endblock %}
{% block head %}<link rel="stylesheet" href="{{ url_for('static', filename='css/page.css') }}">{% endblock %}
{% block content %}
<main class="page">
  <div class="page-inner">
    {# Loads, then posts itself. The button is for a browser without JavaScript. #}
    <form hx-post="/quizzes/{{ quiz_id }}/start" hx-trigger="load" hx-target="this" hx-swap="outerHTML"
          method="post" action="/quizzes/{{ quiz_id }}/start">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <p class="empty-state">Starting…</p>
      <noscript><button type="submit" class="btn primary">Start the quiz</button></noscript>
    </form>
  </div>
</main>
{% endblock %}
