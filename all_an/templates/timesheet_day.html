{% extends "base.html" %}
{% block title %}{{ row.heading }} · Timesheet · all-an{% endblock %}
{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/page.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/timesheet.css') }}">
{% endblock %}
{% block content %}
<main class="page">
  <div class="page-inner">
    <a class="ts-back" href="/timesheet/{{ year }}/{{ month }}">← {{ month_name }} {{ year }}</a>
    <header class="page-head">
      <div>
        <h1>{{ row.heading }} {{ year }}</h1>
      </div>
    </header>

    {% include "partials/timesheet_day_form.html" %}
  </div>
</main>
{% endblock %}
