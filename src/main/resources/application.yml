spring:
  application:
    name: all-an-app
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/all-an-db}
    username: ${SPRING_DATASOURCE_USERNAME:allan}
    password: ${SPRING_DATASOURCE_PASSWORD:allan}
  jpa:
    hibernate:
      # Flyway owns the schema now. validate makes a drift between the entities and the
      # migrations fail at startup instead of silently altering tables.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    # Existing databases predate Flyway: they were built by Hibernate and have no schema history.
    # baseline-on-migrate marks them at V1 and applies V2+ on top, so no data is lost.
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: ${PORT:8080}
  # Render terminates TLS at its proxy, so without this every request looks like it came from the
  # proxy: one IP for the whole internet, and the messages daily limit would throttle everyone at
  # once. "framework" installs ForwardedHeaderFilter, which makes getRemoteAddr() report the
  # client address from X-Forwarded-For. Only trustworthy because the proxy sets that header
  # itself - running this app with a port exposed directly to the internet would let anyone spoof it.
  forward-headers-strategy: framework

logging:
  level:
    com.allan.app: INFO
