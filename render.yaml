# Render Blueprint: the Odin app as a Docker web service, with a Postgres database for messages.
# New → Blueprint → pick this repo. The database's connection string is wired into DATABASE_URL.
databases:
  - name: all-an-db-odin
    databaseName: all_an
    user: all_an
    # The free plan is for trying things out; check Render's current limits before relying on it.
    plan: free

services:
  - type: web
    name: all-an
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: all-an-db-odin
          property: connectionString
      # Render puts one proxy in front of the app; see TRUSTED_PROXY_HOPS in README-all-an.md.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # Anyone can create an account while this is true. Set it to "false" after you have yours.
      - key: REGISTRATION_OPEN
        value: "true"
      - key: CONTACT_EMAIL
        value: allan6tech@gmail.com
      # Optional: a long random value, set in the dashboard, to read messages at /admin/messages?token=...
      - key: ADMIN_TOKEN
        sync: false
