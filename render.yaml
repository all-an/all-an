# Render blueprint. Creates the database and the web service together, so a fresh deployment is
# one commit rather than a sequence of console clicks.
#
# There is no Docker image anywhere in this file. `runtime: python` builds from source on Render:
# pip install, then start gunicorn. No registry, no cross-architecture build.

databases:
  - name: all-an-database
    # The Postgres database name. Render will not accept the hyphens the service name uses.
    databaseName: all_an_database
    user: all_an
    plan: free

services:
  - type: web
    name: all-an
    runtime: python
    plan: free
    region: oregon

    buildCommand: pip install -r requirements.txt
    # PORT is injected by Render and gunicorn binds to it on its own; workers and threads come from
    # gunicorn.conf.py. Migrations run as each worker starts, before it serves a request.
    startCommand: gunicorn all_an.wsgi:app

    # The check hits the database rather than just returning 200, so an instance that cannot reach
    # Postgres never reports healthy - and Render keeps the previous deploy serving instead of
    # replacing it with a broken one.
    healthCheckPath: /healthz

    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"

      - key: DATABASE_URL
        fromDatabase:
          name: all-an-database
          # The internal connection string: it stays on Render's private network, so it needs no
          # TLS, and db.py recognises the single-label hostname and disables SSL for it.
          property: connectionString

      # Behind Render's proxy, so X-Forwarded-For is trustworthy and the per-IP throttles see the
      # real client rather than one address for the whole internet.
      - key: TRUST_PROXY_HEADERS
        value: "true"

      - key: SESSION_COOKIE_SECURE
        value: "true"

      - key: SITE_URL
        value: https://all-an.onrender.com

      # Set in the dashboard, not here. sync: false means Render prompts for them on first deploy
      # and never stores them in the repository.
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
